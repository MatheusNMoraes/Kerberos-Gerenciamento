{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Conta — Fama Pet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="position-relative">

    <div class="bg-banner position-fixed top-0 start-0 z-0"></div>

    <div class="min-vh-100 d-flex align-items-center justify-content-center position-relative z-1 py-4">
        <div class="auth-wrapper" style="max-width: 420px; width: 100%;">
            
            <!-- Abas Superiores -->
            <div class="d-flex justify-content-between px-2 mb-2">
                <a href="{% url 'login' %}" class="tab-link active">Entrar</a>
                <a href="{% url 'cadastro' %}" class="tab-link inactive">Cadastrar</a>
            </div>

            <div class="auth-card shadow-sm">
                <h1 class="auth-title mb-4">Acessar<br>conta:</h1>

                <!-- Mensagem de Erro de Credenciais (Se o usuário ou senha estiverem errados) -->
                {% if form.errors %}
                  <div class="alert alert-danger py-2 small mb-3 text-center" role="alert">
                    Nome de usuário ou senha incorretos.
                  </div>
                {% endif %}

                <!-- Mensagens do Django (ex: cadastro realizado com sucesso) -->
                {% if messages %}
                  {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-3 py-2 small" role="alert">
                      {{ message }}
                      <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Fechar"></button>
                    </div>
                  {% endfor %}
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-3 text-start">
                    <label for="id_username" class="form-label small fw-bold">E-mail</label>
                    <input type="email" 
                           name="username" 
                           id="id_username" 
                           class="form-control {% if form.errors %}is-invalid{% endif %}" 
                           placeholder="seuemail@exemplo.com" 
                           required 
                           autofocus>
                    </div>
                    
                    <div class="mb-3 text-start">
                        <label for="id_password" class="form-label small fw-bold">Senha</label>
                        <input type="password" 
                               name="password" 
                               id="id_password" 
                               class="form-control {% if form.errors %}is-invalid{% endif %}" 
                               placeholder="Digite sua senha" 
                               required>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-custom w-100">Entrar</button>
                    </div>
                </form>

                <div class="text-end mt-4">
                    <a href="#" class="help-link">Precisa de ajuda?</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
