{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifique seu e-mail — Fama Pet</title>
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link rel="stylesheet" href="{% static 'css/brand.css' %}">
</head>

<body class="position-relative">
  <div class="bg-banner position-fixed top-0 start-0 z-0"></div>
  <main class="min-vh-100 d-flex align-items-center justify-content-center position-relative z-1 py-4">
    <div class="auth-wrapper" style="max-width: 420px; width: 100%;">
      <section class="auth-card shadow-sm">
        <h1 class="auth-title">Verifique seu e-mail</h1>
        <p class="text-secondary">Se houver uma conta associada ao endereço informado, enviaremos um link para redefinir a senha.</p>
        <p class="text-secondary small mb-0">Confira também a pasta de spam. O link tem validade limitada.</p>
        <div class="text-center mt-4">
          <a href="{% url 'login' %}" class="help-link">Voltar para o login</a>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
