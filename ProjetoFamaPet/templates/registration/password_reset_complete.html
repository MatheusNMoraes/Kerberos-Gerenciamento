{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senha alterada — Fama Pet</title>
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link rel="stylesheet" href="{% static 'css/brand.css' %}">
</head>

<body class="position-relative">
  <div class="bg-banner position-fixed top-0 start-0 z-0"></div>
  <main class="min-vh-100 d-flex align-items-center justify-content-center position-relative z-1 py-4">
    <div class="auth-wrapper" style="max-width: 420px; width: 100%;">
      <section class="auth-card shadow-sm">
        <h1 class="auth-title">Senha alterada</h1>
        <p class="text-secondary">Sua senha foi redefinida. Agora você já pode acessar sua conta.</p>
        <a href="{% url 'login' %}" class="btn btn-custom w-100 text-decoration-none">Ir para o login</a>
      </section>
    </div>
  </main>
</body>

</html>
