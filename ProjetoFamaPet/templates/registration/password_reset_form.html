{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha — Fama Pet</title>
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link rel="stylesheet" href="{% static 'css/brand.css' %}">
</head>

<body class="position-relative">
  <div class="bg-banner position-fixed top-0 start-0 z-0"></div>
  <main class="min-vh-100 d-flex align-items-center justify-content-center position-relative z-1 py-4">
    <div class="auth-wrapper" style="max-width: 420px; width: 100%;">
      <section class="auth-card shadow-sm">
        <h1 class="auth-title">Recuperar senha</h1>
        <p class="text-secondary small">Informe o e-mail cadastrado para receber um link de redefinição.</p>

        {% if form.email.errors %}
        <div class="alert alert-danger py-2 small" role="alert">{{ form.email.errors }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3 text-start">
            <label for="id_email" class="form-label small fw-bold">E-mail</label>
            <input type="email" name="email" id="id_email" class="form-control" autocomplete="email"
              placeholder="Digite seu e-mail" required autofocus>
          </div>
          <button type="submit" class="btn btn-custom w-100">Enviar link</button>
        </form>

        <div class="text-center mt-4">
          <a href="{% url 'login' %}" class="help-link">Voltar para o login</a>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
