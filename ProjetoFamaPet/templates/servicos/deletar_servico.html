{% extends 'base/base.html' %}

{% block titulo %}Remover Serviço — FamaPet{% endblock %}

{% block content %}
<div class="container my-4 my-md-5 px-3" style="max-width: 500px;">

  <div class="card shadow-sm border-0 rounded-3 overflow-hidden text-center">
    <div class="card-body p-4 p-md-5">
      <div class="text-danger fs-1 mb-3">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>

      <h3 class="h4 fw-bold mb-2">Excluir Serviço</h3>
      <p class="text-muted mb-4">
        Tem certeza que deseja remover o serviço <strong class="text-dark">{{ servico.nome }}</strong>?
      </p>

      <form method="POST">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'listar_servicos' %}" class="btn btn-outline-secondary px-4 py-2 fw-bold">
            Cancelar
          </a>
          <button type="submit" class="btn btn-danger px-4 py-2 fw-bold shadow-sm">
            <i class="bi bi-trash me-1"></i> Confirmar
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
