services:
  - type: web
    name: famapet-web
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-production.txt && cd ProjetoFamaPet && python manage.py collectstatic --noinput
    startCommand: cd ProjetoFamaPet && python manage.py migrate --noinput && python -m gunicorn FamaPet.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --access-logfile - --error-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: famapet-db
          property: connectionString
      - key: USE_X_FORWARDED_PROTO
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"
      - key: SECURE_HSTS_PRELOAD
        value: "False"

databases:
  - name: famapet-db
    databaseName: famapet
    user: famapet
    region: oregon
    plan: free
    postgresMajorVersion: "17"
