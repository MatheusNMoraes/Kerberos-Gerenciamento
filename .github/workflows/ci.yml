name: Django CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: famapet
          POSTGRES_USER: famapet
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U famapet -d famapet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-key-used-for-tests-not-production-8QfZ3vL2
      DATABASE_URL: postgres://famapet:ci-only-password@localhost:5432/famapet
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        working-directory: ProjetoFamaPet
        run: python manage.py check
      - name: Check for missing migrations
        working-directory: ProjetoFamaPet
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        working-directory: ProjetoFamaPet
        run: python manage.py test
